<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Xoftverse">
  <title>Xoftverse</title>
  <!-- tile with a stitched edge -->
  <rect x="3" y="3" width="94" height="94" rx="24" fill="#14171c"/>
  <rect x="11" y="11" width="78" height="78" rx="17" fill="none" stroke="#efe6d6" stroke-opacity=".38" stroke-width="2" stroke-dasharray="4.5 4" stroke-linecap="round"/>
  <!-- circuit trace: top-left to bottom-right -->
  <path d="M30 30L70 70" stroke="#5fe0b0" stroke-width="6" stroke-linecap="round"/>
  <circle cx="28" cy="28" r="8.5" fill="#5fe0b0"/><circle cx="28" cy="28" r="3" fill="#14171c"/>
  <circle cx="72" cy="72" r="8.5" fill="#5fe0b0"/><circle cx="72" cy="72" r="3" fill="#14171c"/>
  <!-- thread crosses over the trace -->
  <path d="M63 37L29 71" stroke="#14171c" stroke-width="10" stroke-linecap="round"/>
  <path d="M63 37L29 71" stroke="#ff5a4f" stroke-width="5" stroke-linecap="round" stroke-dasharray="5.5 6.5"/>
  <!-- needle: thread runs out of the eye -->
  <path d="M59.6 37.6L77.9 19.9L84 16L80.1 22.1L62.4 40.4Z" fill="#d9dee7"/>
  <circle cx="61" cy="39" r="2" fill="#d9dee7"/>
  <path d="M62.6 37.4L65.2 34.8" stroke="#14171c" stroke-width="1.4" stroke-linecap="round"/>
</svg>
